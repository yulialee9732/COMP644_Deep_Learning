<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Forward pass and notation</title><desc id="desc">[(&#x27;Column input&#x27;, &#x27;a⁽⁰⁾=(1,2)ᵀ&#x27;), (&#x27;Matrix multiply&#x27;, &#x27;W=[[1,−1],[2,0]]&#x27;), (&#x27;Preactivation&#x27;, &#x27;z=(−1,2)ᵀ&#x27;), (&#x27;ReLU&#x27;, &#x27;a=(0,2)ᵀ; cache z and input&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Forward pass and notation</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Column input</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">a⁽⁰⁾=(1,2)ᵀ</text><path d="M275.5 205.0 H290.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Matrix multiply</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">W=[[1,−1],[2,0]]</text><path d="M531.0 205.0 H546.0" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Preactivation</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">z=(−1,2)ᵀ</text><path d="M786.5 205.0 H801.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-