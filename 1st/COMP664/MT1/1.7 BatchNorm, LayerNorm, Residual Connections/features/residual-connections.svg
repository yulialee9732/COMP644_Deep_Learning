<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Residual connections</title><desc id="desc">[(&#x27;Input x&#x27;, &#x27;Branches into two paths&#x27;), (&#x27;Identity path&#x27;, &#x27;Carries x directly&#x27;), (&#x27;Residual branch&#x27;, &#x27;Computes F(x)&#x27;), (&#x27;Add&#x27;, &#x27;y=x+F(x); backward: g + JFᵀg&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Residual connections</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Input x</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Branches into two paths</text><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Identity path</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Carries x directly</text><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Residual branch</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Computes F(x)</text><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Add</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">y=x+F(x); backward: g +</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">JFᵀg</text><text x="4