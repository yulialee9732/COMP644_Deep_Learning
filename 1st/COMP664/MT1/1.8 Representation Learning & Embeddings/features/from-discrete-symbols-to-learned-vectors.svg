<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="376" viewBox="0 0 1080 376" role="img" aria-labelledby="title desc"><title id="title">From discrete symbols to learned vectors</title><desc id="desc">{&#x27;rows&#x27;: [&#x27;token 1&#x27;, &#x27;token 2 ←&#x27;, &#x27;token 3&#x27;], &#x27;cols&#x27;: [&#x27;dim 1&#x27;, &#x27;dim 2&#x27;], &#x27;values&#x27;: [[1, 0], [2, 3], [-1, 4]], &#x27;footer&#x27;: &#x27;One-hot [0,1,0] selects row 2 → [2,3]. Whole words or subwords can index rows.&#x27;}</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="376" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">From discrete symbols to learned vectors</text><text x="327.5" y="105" font-size="18" fill="#172b4d" text-anchor="middle">dim 1</text><text x="492.5" y="105" font-size="18" fill="#172b4d" text-anchor="middle">dim 2</text><text x="225" y="158" font-size="18" fill="#172b4d" text-anchor="end">token 1</text><rect x="245" y="125" width="165" height="52" fill="rgba(60,120,200,0.255)" stroke="white"/><text x="327.5" y="158" font-size="21" fill="#172b4d" text-anchor="middle">1</text><rect x="410" y="125" width="165" height="52" fill="rgba(60,120,200,0.08)" stroke="white"/><text x="492.5" y="158" font-size="21" fill="#172b4d" text-anchor="middle">0</text><text x="225" y="210" font-size="18" fill="#172b4d" text-anchor="end">token 2 ←</text><rect x="245" y="177" width="165" height="52" fill="rgba(60,120,200,0.43)" stroke="white"/><text x="327.5" y="210" font-size="21" fill="#172b4d" text-anchor="middle">2</text><rect x="410" y="177" width="165" height="52" fill="rgba(60,120,200,0.6049999999999999)" stroke="white"/><text x="492.5" y="210" font-size="21" fill="#172b4d" text-anchor="middle">3</text><text x="225" y="262" font-size="18" fill="#172b4d" text-anchor="end">token 3</text><rect x="245" y="229" width="165" height="52" fill="rgba(60,120,200,0.255)" stroke="white"/><text x="327.5" y="262" font-size="21" fill="#172b4d" text-anchor="middle">-1</text><rect x="410" y="229" width="165" height="52" fill="rgba(60,120,200,0.7799999999999999)" stroke="white"/><text x="492.5" y="262" font-size="21" fill="#172b4d" text-anchor="middle">4</text><text x="40" y="321" font-size="17" fill="#172b4d" text-anchor="start">One-hot [0,1,0] selects row 2 → [2,3]. Whole words or subwords can index rows.</text></g></svg>