<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Negative sampling</title><desc id="desc">[(&#x27;Observed pair&#x27;, &#x27;fox + brown → label 1&#x27;), (&#x27;Noise pair&#x27;, &#x27;fox + computer → label 0&#x27;), (&#x27;At scores zero&#x27;, &#x27;positive derivative −0.5; negative +0.5&#x27;), (&#x27;Update&#x27;, &#x27;Raise observed score; lower noise score&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Negative sampling</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Observed pair</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">fox + brown → label 1</text><path d="M275.5 205.0 H290.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Noise pair</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">fox + computer → label</text><text x="309.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">0</text><path d="M531.0 205.0 H546.0" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">At scores zero</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">positive derivative</text><text x="565.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">−0.5; negative +0.5</text><path d="M786.5 205.0 H801.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Update</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Raise observed score;</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">lower noise score</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>