<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Static versus contextual</title><desc id="desc">[(&#x27;river bank&#x27;, &#x27;Static lookup: E[bank]&#x27;), (&#x27;bank loan&#x27;, &#x27;Same lookup: E[bank]&#x27;), (&#x27;Sequence model&#x27;, &#x27;Different surrounding context&#x27;), (&#x27;Contextual output&#x27;, &#x27;h(bank, river) ≠ h(bank, loan)&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Static versus contextual</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">river bank</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Static lookup: E[bank]</text><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">bank loan</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Same lookup: E[bank]</text><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Sequence model</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Different surrounding</text><text x="565.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">context</text><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Contextual output</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">h(bank, river) ≠</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">h(bank, loan)</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>