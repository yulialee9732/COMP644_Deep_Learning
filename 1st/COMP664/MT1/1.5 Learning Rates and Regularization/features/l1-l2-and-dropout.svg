<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">L1, L2, and dropout</title><desc id="desc">[(&#x27;L1 penalty&#x27;, &#x27;|w|: kink at zero → sparse optimum&#x27;), (&#x27;L2 penalty&#x27;, &#x27;w²/2: gradient w → shrinkage&#x27;), (&#x27;Dropout training&#x27;, &#x27;(2,4,6,8) → mask → (4,0,12,0)&#x27;), (&#x27;Dropout inference&#x27;, &#x27;Use (2,4,6,8); no extra scaling&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">L1, L2, and dropout</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">L1 penalty</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">|w|: kink at zero →</text><text x="54.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">sparse optimum</text><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">L2 penalty</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">w²/2: gradient w →</text><text x="309.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">shrinkage</text><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Dropout training</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">(2,4,6,8) → mask →</text><text x="565.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">(4,0,12,0)</text><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Dropout inference</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Use (2,4,6,8); no extra</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">scaling</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>