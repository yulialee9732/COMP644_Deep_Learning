<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">How the layers fit together</title><desc id="desc">[(&#x27;Image&#x27;, &#x27;Local pixels; receptive field 1&#x27;), (&#x27;3×3 convolution&#x27;, &#x27;Receptive field 3&#x27;), (&#x27;3×3 convolution&#x27;, &#x27;Receptive field 5&#x27;), (&#x27;2×2 pool → classifier&#x27;, &#x27;Field 6; aggregate or flatten features&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">How the layers fit together</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Image</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Local pixels; receptive</text><text x="54.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">field 1</text><path d="M275.5 205.0 H290.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">3×3 convolution</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Receptive field 3</text><path d="M531.0 205.0 H546.0" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">3×3 convolution</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Receptive field 5</text><path d="M786.5 205.0 H801.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">2×2 pool → classifier</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Field 6; aggregate or</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">flatten features</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>