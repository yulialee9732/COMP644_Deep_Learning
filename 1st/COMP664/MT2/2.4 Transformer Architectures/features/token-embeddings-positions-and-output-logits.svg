<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Token embeddings, positions, and output logits</title><desc id="desc">[(&#x27;Token + position&#x27;, &#x27;xᵢ=E[tokenᵢ]+P[i]&#x27;), (&#x27;Contextual stack&#x27;, &#x27;Refines vectors while preserving width d&#x27;), (&#x27;Tied output head&#x27;, &#x27;h:1×d times Eᵀ:d×V&#x27;), (&#x27;Vocabulary distribution&#x27;, &#x27;V logits → softmax → next-token choice&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Token embeddings, positions, and output logits</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Token + position</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">xᵢ=E[tokenᵢ]+P[i]</text><path d="M275.5 205.0 H290.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Contextual stack</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Refines vectors while</text><text x="309.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">preserving width d</text><path d="M531.0 205.0 H546.0" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Tied output head</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">h:1×d times Eᵀ:d×V</text><path d="M786.5 205.0 H801.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Vocabulary distribution</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">V logits → softmax →</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">next-token choice</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>