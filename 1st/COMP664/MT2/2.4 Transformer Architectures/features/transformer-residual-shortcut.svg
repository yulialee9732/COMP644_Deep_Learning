<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Transformer residual shortcut</title><desc id="desc">{}</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Transformer residual shortcut</text><rect x="55" y="175" width="250" height="65" rx="10" fill="#e8f1ff" stroke="#7e9fc6"/><text x="180" y="215" font-size="20" fill="#172b4d" text-anchor="middle">Input x</text><rect x="425" y="90" width="250" height="65" rx="10" fill="#e8f1ff" stroke="#7e9fc6"/><text x="550" y="130" font-size="20" fill="#172b4d" text-anchor="middle">Learned branch F(x)</text><rect x="425" y="250" width="250" height="65" rx="10" fill="#e8f1ff" stroke="#7e9fc6"/><text x="550" y="290" font-size="20" fill="#172b4d" text-anchor="middle">Identity path x</text><circle cx="825" cy="207" r="28" fill="#e6f7f0" stroke="#5c9e80"/><text x="825" y="215" font-size="28" fill="#172b4d" text-anchor="middle">+</text><path d="M305 207 H355 V122 H420" fill="none" stroke="#345c8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M355 207 V282 H420" fill="none" stroke="#345c8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M675 122 H765 V179 H810" fill="none" stroke="#345c8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M675 282 H765 V235 H810" fill="none" stroke="#345c8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M853 207 H1010" fill="none" stroke="#345c8c" stroke-width="3" marker-end="url(#arrow)"/><text x="825" y="330" font-size="22" fill="#172b4d" text-anchor="middle">y = x + F(x)</text></g></svg>