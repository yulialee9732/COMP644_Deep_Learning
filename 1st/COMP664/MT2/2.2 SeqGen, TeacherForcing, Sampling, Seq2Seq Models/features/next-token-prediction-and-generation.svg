ill="#172b4d" text-anchor="start">product=0.28</text><path d="M786.5 205.0 H801.5" stroke="#345c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Lesson</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Best immediate token ≠</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">best full path</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>