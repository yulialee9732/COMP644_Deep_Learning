<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Modeling a sequence</title><desc id="desc">[(&#x27;Full history&#x27;, &#x27;the quick brown fox&#x27;), (&#x27;Bigram state&#x27;, &#x27;fox → next-token distribution&#x27;), (&#x27;Trigram state&#x27;, &#x27;brown fox → next-token distribution&#x27;), (&#x27;Tradeoff&#x27;, &#x27;More history → Vᵏ contexts to estimate&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Modeling a sequence</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Full history</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">the quick brown fox</text><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Bigram state</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">fox → next-token</text><text x="309.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">distribution</text><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Trigram state</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">brown fox → next-token</text><text x="565.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">distribution</text><rect x="806.5" y="105" width="233.5" height="200" rx="12" fill="#f2eaff" stroke="#b5c7de"/><text x="820.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Tradeoff</text><text x="820.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">More history → Vᵏ</text><text x="820.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">contexts to estimate</text><text x="40" y="350" font-size="16" fill="#536780" text-anchor="start">Read the annotations together with the equations in the notes.</text></g></svg>