<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Autoregressive pretraining and generation</title><desc id="desc">[(&#x27;Raw text&#x27;, &#x27;Create prefix → next-token targets&#x27;), (&#x27;Pretraining&#x27;, &#x27;Gradient updates change θ&#x27;), (&#x27;Prompt / examples&#x27;, &#x27;Condition activations; θ stays fixed&#x27;), (&#x27;Generation / workflow&#x27;, &#x27;Select tokens; reuse outputs in later calls&#x27;)]</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#345c8c"/></marker></defs><rect width="1080" height="390" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="35" font-size="24" fill="#172b4d" text-anchor="start">Autoregressive pretraining and generation</text><rect x="40.0" y="105" width="233.5" height="200" rx="12" fill="#e8f1ff" stroke="#b5c7de"/><text x="54.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Raw text</text><text x="54.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Create prefix →</text><text x="54.0" y="225" font-size="17" fill="#172b4d" text-anchor="start">next-token targets</text><rect x="295.5" y="105" width="233.5" height="200" rx="12" fill="#e6f7f0" stroke="#b5c7de"/><text x="309.5" y="137" font-size="18" fill="#172b4d" text-anchor="start">Pretraining</text><text x="309.5" y="200" font-size="17" fill="#172b4d" text-anchor="start">Gradient updates change</text><text x="309.5" y="225" font-size="17" fill="#172b4d" text-anchor="start">θ</text><rect x="551.0" y="105" width="233.5" height="200" rx="12" fill="#fff4db" stroke="#b5c7de"/><text x="565.0" y="137" font-size="18" fill="#172b4d" text-anchor="start">Prompt / examples</text><text x="565.0" y="200" font-size="17" fill="#172b4d" text-anchor="start">Condition activations;</text><text x="565.0" y="225" font-size="17" fill="#172b4d" text-anchor="star